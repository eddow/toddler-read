name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build debug APK
        run: npm run android:build

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk toddler-read.apk

      - name: Create manual release tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag --force manual-android-release "$GITHUB_SHA"
          git push --force origin manual-android-release

      - name: Publish GitHub release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && 'manual-android-release' || github.ref_name }}
          files: toddler-read.apk
