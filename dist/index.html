<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Toddler Player</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html, body { width: 100%; height: 100%; overflow: hidden; background: #fff8e7; }
		.container {
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			height: 100%;
			gap: 1rem;
		}

		.btn {
			border: none;
			background: transparent;
			padding: 0;
			margin: 0;
			outline: none;
			cursor: pointer;
			-webkit-appearance: none;
			appearance: none;
			display: flex;							 /* shrink-wrap the sprite */
			justify-content: center;
			align-items: center;
			width: fit-content;					/* only as wide as the sprite */
			height: fit-content;
			-webkit-tap-highlight-color: transparent;
		}

		.btn-sprite {
			display: block;
			width: 70vw;
			max-width: 260px;
			height: auto;
			aspect-ratio: 273 / 267;
			background-image: url('/assets/Pause-Play-Stop-Button-Transparent--AgZrnNm.png');
			background-size: 300% 100%;
			background-repeat: no-repeat;
		}

		/* Play – middle portion */
		#playBtn .btn-sprite {
			background-position: 50% 0%;
		}

		/* Stop – right portion */
		#stopBtn .btn-sprite {
			background-position: 100% 0%;
			width: 50vw;								 /* stop button a bit smaller */
			max-width: 180px;
		}

		.hidden { display: none; }
	</style>
</head>
<body>
	<div class="container">
		<!-- Manual mode: Play and Stop visible from start -->
		<button class="btn" id="playBtn">
			<span class="btn-sprite"></span>
		</button>
		<button class="btn" id="stopBtn">
			<span class="btn-sprite"></span>
		</button>
	</div>

	<audio id="audio" preload="auto"></audio>

	<script>
		(function() {
			const audio = document.getElementById('audio');
			const playBtn = document.getElementById('playBtn');
			const stopBtn = document.getElementById('stopBtn');
			let currentTts = null;

			function closePage() {
				if (!audio.paused) { audio.pause(); audio.currentTime = 0; }
				const synth = getSpeechSynthesis();
				if (synth) synth.cancel();
				window.close();
				setTimeout(() => { if (!window.closed) window.history.back(); }, 100);
			}

			function loadAndTryPlay(src) {
				currentTts = null;
				audio.src = src;
				audio.load();
				// Try to play (may be blocked, but it's manual mode so user will tap play)
				audio.play().catch(() => {});
			}

			function getSpeechSynthesis() {
				return window.speechSynthesis || null;
			}

			function parseTtsContent(content) {
				const match = content.match(/^tts:([a-z]{2,3}(?:-[a-z0-9]{2,8})*):([\s\S]+)$/i);
				if (!match) return null;

				return {
					lang: match[1],
					text: match[2].trim(),
				};
			}

			function speakCurrentTts() {
				if (!currentTts) return;

				const synth = getSpeechSynthesis();
				if (!synth || !window.SpeechSynthesisUtterance) return;

				synth.cancel();
				const utterance = new SpeechSynthesisUtterance(currentTts.text);
				utterance.lang = currentTts.lang;
				synth.speak(utterance);
			}

			function loadAndTrySpeak(tts) {
				currentTts = tts;
				audio.pause();
				audio.removeAttribute('src');
				audio.load();
				speakCurrentTts();
			}

			// --- Get source from hash ---
			const hash = decodeURIComponent(window.location.hash.substring(1));
			const tts = hash ? parseTtsContent(hash) : null;
			const src = hash || null;

			if (tts && tts.text) {
				loadAndTrySpeak(tts);
			} else if (src) {
				loadAndTryPlay(src);
			} else {
				// No hash – play fallback then close
				loadAndTryPlay('./no.mp3');
			}

			// --- Error fallback to no.mp3 ---
			audio.addEventListener('error', function onError() {
				audio.removeEventListener('error', onError);
				audio.src = './no.mp3';
				audio.load();
				audio.play().catch(() => {});
				// Close after fallback ends
				audio.addEventListener('ended', function onFallbackEnd() {
					audio.removeEventListener('ended', onFallbackEnd);
					closePage();
				});
			});

			// --- Play button: restart sound ---
			playBtn.addEventListener('click', () => {
				if (currentTts) {
					speakCurrentTts();
					return;
				}

				audio.currentTime = 0;
				audio.play().catch(() => {});
			});

			// --- Stop button: close page ---
			stopBtn.addEventListener('click', closePage);
		})();
	</script>
</body>
</html>
